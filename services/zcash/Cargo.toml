[package]
name = "darkpool-zcash"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# This release family built and passed local Spike A/B capability tests.
# Live payment, scanning, payout and PCZT compatibility remain separate gates.
[dependencies]
zcash_client_backend = { version = "=0.24.0", default-features = false, features = ["orchard", "sync", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "=0.22.0", default-features = false, features = ["orchard"] }
zcash_keys = { version = "=0.16.1", default-features = false, features = ["std", "orchard", "sapling"] }
zcash_protocol = "=0.10.6"
zip321 = "=0.9.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "array"] }
zip32 = "=0.2.1"
async-trait = "=0.1.91"
tokio = { version = "=1.53.1", features = ["rt", "time", "net"] }
tonic = { version = "=0.14.5", default-features = false, features = ["transport", "tls-webpki-roots", "tls-ring"] }
serde_json = "=1.0.151"
prost = "=0.14.4"
# Already-resolved TLS type used only for closed diagnostic downcasts; connector unchanged.
rustls = { version = "=0.23.42", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.4", default-features = false }

[dev-dependencies]
zcash_client_backend = { version = "=0.24.0", default-features = false, features = ["orchard", "test-dependencies"] }
secrecy = "=0.8.0"
tempfile = "=3.27.0"
zcash_primitives = { version = "=0.30.1", default-features = false }
